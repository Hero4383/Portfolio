<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nathan Storms — AI Systems Architect and Software Engineer</title>
  <desc id="desc">A dark green portfolio card with the phrase Building AI systems that earn trust and a conceptual system loop.</desc>
  <defs>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientTransform="translate(170 95) rotate(45) scale(520)">
      <stop stop-color="#275f48" stop-opacity=".48"/>
      <stop offset="1" stop-color="#06100e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0" cy="0" r="1" gradientTransform="translate(1080 100) rotate(135) scale(430)">
      <stop stop-color="#9f7834" stop-opacity=".28"/>
      <stop offset="1" stop-color="#06100e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#f3f0e8" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#06100e"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="44" y="44" width="1112" height="542" rx="30" fill="#081411" fill-opacity=".78" stroke="#f3f0e8" stroke-opacity=".15"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="91" cy="91" r="22" fill="#71d39c" fill-opacity=".08" stroke="#71d39c" stroke-opacity=".65"/>
    <text x="91" y="96" text-anchor="middle" fill="#9ce9bb" font-size="11" font-weight="800" letter-spacing="1">NS</text>
    <text x="126" y="97" fill="#f3f0e8" font-size="21" font-weight="700">Nathan Storms</text>

    <line x1="88" y1="169" x2="120" y2="169" stroke="#71d39c"/>
    <text x="133" y="174" fill="#9ce9bb" font-size="16" font-weight="700" letter-spacing="2.2">AI SYSTEMS ARCHITECTURE</text>

    <text x="86" y="266" fill="#f3f0e8" font-size="64" font-weight="700" letter-spacing="-3.5">Building AI systems</text>
    <text x="86" y="340" fill="#f3f0e8" font-size="64" font-weight="700" letter-spacing="-3.5">that earn trust.</text>

    <text x="89" y="412" fill="#b7bdb4" font-size="23">Governed autonomy · Resilient delivery · Tested recovery</text>
    <text x="89" y="533" fill="#e7bf6a" font-size="16" font-weight="700" letter-spacing="1.2">AI SYSTEMS ARCHITECT &amp; SOFTWARE ENGINEER</text>
  </g>

  <g transform="translate(932 307)">
    <circle r="142" fill="#10231d" fill-opacity=".75" stroke="#71d39c" stroke-opacity=".24" stroke-dasharray="6 9"/>
    <circle r="88" fill="none" stroke="#e7bf6a" stroke-opacity=".24"/>
    <circle r="58" fill="#081411" stroke="#9ce9bb" stroke-opacity=".42"/>
    <path d="M0 19V-12" stroke="#f3f0e8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-1-2c-17 0-26-10-26-26 17 0 26 9 26 26Z" fill="#71d39c"/>
    <path d="M1 11c17 0 26-10 26-26-17 0-26 9-26 26Z" fill="#e7bf6a"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#e8e5dc" text-anchor="middle">
      <g transform="translate(0 -142)"><rect x="-39" y="-16" width="78" height="32" rx="16" fill="#10231d" stroke="#f3f0e8" stroke-opacity=".2"/><text y="5">PLAN</text></g>
      <g transform="translate(142 0)"><rect x="-35" y="-16" width="70" height="32" rx="16" fill="#10231d" stroke="#f3f0e8" stroke-opacity=".2"/><text y="5">ACT</text></g>
      <g transform="translate(0 142)"><rect x="-43" y="-16" width="86" height="32" rx="16" fill="#10231d" stroke="#f3f0e8" stroke-opacity=".2"/><text y="5">VERIFY</text></g>
      <g transform="translate(-142 0)"><rect x="-51" y="-16" width="102" height="32" rx="16" fill="#10231d" stroke="#f3f0e8" stroke-opacity=".2"/><text y="5">RECOVER</text></g>
    </g>
