<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nathan Storms — AI Systems Architect and Software Engineer</title>
  <desc id="desc">A bright blue, green, and slate portfolio card about governed AI systems, resilient delivery, and tested recovery.</desc>
  <defs>
    <linearGradient id="portfolioGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2c3e50"/>
      <stop offset=".28" stop-color="#34495e"/>
      <stop offset=".54" stop-color="#4a6741"/>
      <stop offset=".78" stop-color="#2980b9"/>
      <stop offset="1" stop-color="#3498db"/>
    </linearGradient>
    <linearGradient id="blueGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3498db"/>
      <stop offset="1" stop-color="#27846d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(980 120) rotate(130) scale(420)">
      <stop stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#16283a" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#portfolioGradient)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="90" cy="570" r="250" fill="#3498db" fill-opacity=".12"/>
  <circle cx="1140" cy="20" r="260" fill="#b7e6ff" fill-opacity=".12"/>

  <rect x="48" y="46" width="1104" height="538" rx="30" fill="#ffffff" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".7" filter="url(#shadow)"/>
  <rect x="48" y="46" width="10" height="538" rx="5" fill="url(#blueGreen)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="99" cy="97" r="24" fill="url(#blueGreen)"/>
    <text x="99" y="102" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1">NS</text>
    <text x="137" y="104" fill="#2c3e50" font-size="22" font-weight="750">Nathan Storms</text>

    <line x1="91" y1="170" x2="123" y2="170" stroke="#2980b9" stroke-width="2"/>
    <text x="137" y="176" fill="#2474aa" font-size="16" font-weight="800" letter-spacing="2.1">AI SYSTEMS ARCHITECTURE</text>

    <text x="88" y="270" fill="#2c3e50" font-size="63" font-weight="760" letter-spacing="-3.2">Building AI systems</text>
    <text x="88" y="343" fill="#2c3e50" font-size="63" font-weight="760" letter-spacing="-3.2">that earn trust.</text>

    <text x="90" y="414" fill="#567089" font-size="23">Governed autonomy · Resilient delivery · Tested recovery</text>
    <rect x="88" y="496" width="431" height="43" rx="21.5" fill="#e8f4fb" stroke="#c7e5f6"/>
    <text x="304" y="523" text-anchor="middle" fill="#2c6187" font-size="15" font-weight="800" letter-spacing="1.1">AI SYSTEMS ARCHITECT &amp; SOFTWARE ENGINEER</text>
  </g>

  <g transform="translate(934 314)">
    <circle r="146" fill="#eaf6fb" stroke="#2980b9" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 9"/>
    <circle r="95" fill="#ffffff" stroke="#4a6741" stroke-opacity=".28" stroke-width="2"/>
    <circle r="59" fill="url(#blueGreen)"/>
    <path d="M0 22V-13" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M-2-1c-18 0-28-10-28-28 18 0 28 10 28 28Z" fill="#d9f4e8"/>
    <path d="M2 12c18 0 28-10 28-28-18 0-28 10-28 28Z" fill="#f5d477"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#2c3e50" text-anchor="middle">
      <g transform="translate(0 -146)"><rect x="-42" y="-17" width="84" height="34" rx="17" fill="#ffffff" stroke="#c6deeb"/><text y="5">PLAN</text></g>
      <g transform="translate(146 0)"><rect x="-37" y="-17" width="74" height="34" rx="17" fill="#ffffff" stroke="#c6deeb"/><text y="5">ACT</text></g>
      <g transform="translate(0 146)"><rect x="-46" y="-17" width="92" height="34" rx="17" fill="#ffffff" stroke="#c6deeb"/><text y="5">VERIFY</text></g>
      <g transform="translate(-146 0)"><rect x="-53" y="-17" width="106" height="34" rx="17" fill="#ffffff" stroke="#c6deeb"/><text y="5">RECOVER</text></g>
    </g>
  </g>
</svg>
